<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판문 레이드 계산기</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>판문 레이드 계산기</h1>

    <!-- 1차 레이드 -->
    <section class="raid">

        <h2>1차 레이드</h2>

        <div class="content">

            <div class="card">
                <h3>입력</h3>

                <label>최대 AP</label>
                <input type="number" id="ap1" value="0">

                <label>금사과</label>
                <input type="number" id="gold1" value="0">

                <label>은사과</label>
                <input type="number" id="silver1" value="0">

                <label>청사과</label>
                <input type="number" id="blue1" value="0">

                <label>동사과</label>
                <input type="number" id="bronze1" value="0">

                <label>인연포 보너스 (%)</label>
                <input type="number" id="bond1" value="0">

            </div>

            <div class="card">
                <h3>결과</h3>
            </div>

            <div class="card">
                <h3>드롭 아이템</h3>
            </div>

        </div>

    </section>

    <!-- 2차 레이드 -->
    <section class="raid">

        <h2>2차 레이드</h2>

        <div class="content">

            <div class="card">
                <h3>입력</h3>

                <label>최대 AP</label>
                <input type="number" id="ap2" value="0">

                <label>금사과</label>
                <input type="number" id="gold2" value="0">

                <label>은사과</label>
                <input type="number" id="silver2" value="0">

                <label>청사과</label>
                <input type="number" id="blue2" value="0">

                <label>동사과</label>
                <input type="number" id="bronze2" value="0">

                <label>인연포 보너스 (%)</label>
                <input type="number" id="bond2" value="0">

            </div>

            <div class="card">
                <h3>결과</h3>
            </div>

            <div class="card">
                <h3>드롭 아이템</h3>
            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
