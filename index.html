<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판문 레이드 계산기</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>판문 레이드 계산기</h1>

    <div class="main-icon-container">
        <img src="images/morgan.png" alt="귀여운 모르간" class="main-icon">
    </div>

    <!-- 1차 레이드 -->
    <section class="raid">

        <h2>1차 레이드</h2>

        <div class="content">

            <div class="card card-input">
                <h3>입력</h3>

                <div class="input-row">
                <label for="ap1">최대 AP</label>
                <input type="number" id="ap1" value="0">
            </div>

            <div class="input-row">
                <img src="images/g_apple.png" class="icon" alt="금사과">
                <label for="gold1">금사과</label>
                <input type="number" id="gold1" value="0">
            </div>

            <div class="input-row">
                <img src="images/s_apple.png" class="icon" alt="은사과">
                <label for="silver1">은사과</label>
                <input type="number" id="silver1" value="0">
            </div>

            <div class="input-row">
                <img src="images/bl_apple.png" class="icon" alt="청사과">
                <label for="blue1">청사과</label>
                <input type="number" id="blue1" value="0">
            </div>

            <div class="input-row">
                <img src="images/br_apple.png" class="icon" alt="동사과">
                <label for="bronze1">동사과</label>
                <input type="number" id="bronze1" value="0">
            </div>

            <div class="input-row">
                <label for="bond1">인연포 보너스(%)</label>
                <input type="number" id="bond1" value="0">
            </div>

            </div>

            <div class="card card-result">
                <h3>결과</h3>

            <div class="input-row">
                <label>총 AP</label>
                <span id="totalAP1">0</span>
            </div>

            <div class="input-row">
                <label>판 수</label>
                <span id="runCount1">0</span>
            </div>

            <div class="input-row">
                <label>획득 인연포</label>
                <span id="bondPoint1">0</span>
            </div>

            <div class="input-row">
                <label>획득 QP</label>
                <span id="qp1">0</span>
            </div>

</div>

            <div class="card card-drop">
                <h3>드롭 아이템(추정값)</h3>
                
                <div class="input-row">
                    <img src="images/piece.png" class="icon" alt="황성의 조각">
                    <label>황성의 조각</label>
                    <span id="piece1">0</span>
                </div>

                <div class="input-row">
                    <img src="images/thread.png" class="icon" alt="무지갯빛 실타래">
                    <label>무지갯빛 실타래</label>
                    <span id="thread1">0</span>
                </div>

                <div class="input-row">
                    <img src="images/baby.png" class="icon" alt="호문쿨루스 베이비">
                    <label>호문클루스 베이비</label>
                    <span id="baby1">0</span>
                </div>

                <div class="input-row">
                    <img src="images/dust.png" class="icon" alt="허영의 먼지">
                    <label>허영의 먼지</label>
                    <span id="dust1">0</span>
                </div>
                
            </div>

        </div>

    </section>

    <!-- 2차 레이드 -->
    <section class="raid">

        <h2>2차 레이드</h2>

        <div class="content">

            <div class="card card-input">
                <h3>입력</h3>

                 <div class="input-row">
                <label for="ap2">최대 AP</label>
                <input type="number" id="ap2" value="0">
            </div>

            <div class="input-row">
                <img src="images/g_apple.png" class="icon" alt="금사과">
                <label for="gold2">금사과</label>
                <input type="number" id="gold2" value="0">
            </div>

            <div class="input-row">
                <img src="images/s_apple.png" class="icon" alt="은사과">
                <label for="silver2">은사과</label>
                <input type="number" id="silver2" value="0">
            </div>

            <div class="input-row">
                <img src="images/bl_apple.png" class="icon" alt="청사과">
                <label for="blue2">청사과</label>
                <input type="number" id="blue2" value="0">
            </div>

            <div class="input-row">
                <img src="images/br_apple.png" class="icon" alt="동사과">
                <label for="bronze2">동사과</label>
                <input type="number" id="bronze2" value="0">
            </div>

            <div class="input-row">
                <label for="bond2">인연포 보너스(%)</label>
                <input type="number" id="bond2" value="0">
            </div>

            </div>
            <div class="card card-result">
                <h3>결과</h3>

                <div class="input-row">
                    <label>총 AP</label>
                    <span id="totalAP2">0</span>
                </div>
                
                <div class="input-row">
                    <label>판 수</label>
                    <span id="runCount2">0</span>
                </div>

                <div class="input-row">
                    <label>획득 인연포</label>
                    <span id="bondPoint2">0</span>
                </div>

                <div class="input-row">
                    <label>획득 QP</label>
                    <span id="qp2">0</span>
                </div>
    </div>      
            
            <div class="card card-drop">
                <h3>드롭 아이템(추정값)</h3>

                <div class="input-row">
                    <img src="images/core.png" class="icon" alt="월광핵">
                    <label>월광핵</label>
                    <span id="core2">0</span>
                </div>
                
                <div class="input-row">
                    <img src="images/claw.png" class="icon" alt="혼돈의 발톱">
                    <label>혼돈의 발톱</label>
                    <span id="claw2">0</span>
                </div>
                
                <div class="input-row">
                    <img src="images/jade.png" class="icon" alt="월광핵">
                    <label>고담곡옥</label>
                    <span id="jade2">0</span>
                </div>
                
                <div class="input-row">
                    <img src="images/bell.png" class="icon" alt="사면의 작은 종">
                    <label>사면의 작은 종</label>
                    <span id="bell2">0</span>
                </div>
            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
